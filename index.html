<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AzurCalculator α</title>
  <link rel="icon" href="assets/icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:400,600,700,800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="refresh-btn" class="brand-logo-btn" type="button" title="Refresh the ship list" aria-label="Refresh the ship list">
        <img src="assets/icon.png" alt="AzurCalc" class="brand-logo" width="500" height="454">
      </button>
      <div class="brand-text">
        <h1>AzurCalculator α</h1>
      </div>
    </div>

    <div class="controls">
      <input type="search" id="search" class="search-box" placeholder="Search a character..." autocomplete="off">

      <input type="search" id="search-class" class="search-box" placeholder="Search by ship class..." autocomplete="off">

      <label class="sort-control">
        Sort by
        <select id="sort-select">
          <option value="name-asc">Name (A → Z)</option>
          <option value="name-desc">Name (Z → A)</option>
          <option value="rarity-desc">Rarity (high → low)</option>
          <option value="rarity-asc">Rarity (low → high)</option>
          <option value="hullType-asc">Class (A → Z)</option>
          <option value="nationality-asc">Nation (A → Z)</option>
          <option value="release-asc">Release order ≈ (old → recent)</option>
          <option value="release-desc">Release order ≈ (recent → old)</option>
        </select>
      </label>
    </div>

    <div class="filters" id="filters"></div>
  </header>

  <main>
    <p id="count" class="count"></p>
    <div id="grid" class="grid"></div>
  </main>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>

      <div class="modal-image-col">
        <div class="modal-image-wrap">
          <img id="modal-image" class="modal-image" src="" alt="">
          <span id="modal-skin-name" class="modal-skin-name"></span>
        </div>
        <div id="modal-skin-strip" class="modal-skin-strip"></div>
      </div>

      <div class="modal-info">
        <div class="modal-info-scroll">
          <div class="modal-heading">
            <img id="modal-nation-watermark" class="modal-nation-watermark" alt="" hidden>
            <img id="modal-hull-icon" class="modal-hull-icon" alt="" hidden>
            <h2 id="modal-name"></h2>
          </div>

          <div id="modal-tags" class="modal-tags"></div>

          <div class="toggle-row">
            <label id="modal-retrofit-control" class="retrofit-checkbox" hidden>
              <input type="checkbox" id="modal-retrofit-checkbox">
              Retrofit
            </label>

            <label id="modal-augment-control" class="augment-checkbox" hidden>
              <input type="checkbox" id="modal-augment-checkbox">
              Unique Augment
            </label>

            <label id="modal-fatesim-control" class="fatesim-checkbox" hidden>
              <input type="checkbox" id="modal-fatesim-checkbox">
              Fate Simulation
            </label>
          </div>

          <div id="modal-level-control" class="modal-level-control" hidden>
            <span class="modal-level-control-label">Level</span>
            <div class="level-notches" id="modal-level-notches">
              <button type="button" class="level-notch" data-level="1">1</button>
              <button type="button" class="level-notch" data-level="10">10</button>
              <button type="button" class="level-notch" data-level="30">30</button>
              <button type="button" class="level-notch" data-level="70">70</button>
              <button type="button" class="level-notch" data-level="100">100</button>
              <button type="button" class="level-notch" data-level="120">120</button>
              <button type="button" class="level-notch" data-level="125">125</button>
            </div>
            <div class="level-input-wrap">
              <input type="number" id="modal-level-input" class="level-input" min="1" max="125" value="1" inputmode="numeric">
              <div class="level-spin-buttons">
                <button type="button" id="modal-level-spin-up" class="level-spin level-spin-up" aria-label="Increase level"></button>
                <button type="button" id="modal-level-spin-down" class="level-spin level-spin-down" aria-label="Decrease level"></button>
              </div>
            </div>
          </div>

          <div id="modal-stats-section" hidden>
            <h3 class="modal-section-title">Stats <span class="modal-subsection-hint">, after active skills, conditions assumed met</span></h3>
            <div class="stats-and-modifiers">
              <div id="modal-stats-table" class="stats-grid"></div>
              <div id="modal-combat-modifiers" class="modal-combat-modifiers"></div>
            </div>
          </div>

          <div id="modal-equipment-section" hidden>
            <h3 class="modal-section-title modal-section-title-row">
              Equipment
              <span class="equip-tools">
                <label class="equip-cap-label" for="modal-equipment-target">Goal</label>
                <select id="modal-equipment-target" class="equip-cap-select"></select>
                <label class="equip-cap-label" for="modal-equipment-cap">Max rarity</label>
                <select id="modal-equipment-cap" class="equip-cap-select"></select>
                <button type="button" id="modal-equipment-optimize" class="equip-optimize">Optimize</button>
              </span>
            </h3>
            <div class="equipment-and-metrics">
              <div id="modal-equipment" class="modal-equipment"></div>
              <div class="combat-metrics-anchor">
                <div id="modal-combat-metrics" class="combat-metrics"></div>
              </div>
            </div>
          </div>

          <div id="modal-skills-section" hidden>
            <h3 class="modal-section-title modal-section-title-row">
              Skills
              <button type="button" id="modal-skills-max-toggle" class="max-level-toggle" aria-pressed="false" hidden>
                <span class="max-level-dot"></span>Max Level
              </button>
            </h3>
            <div id="modal-skills" class="modal-skills-list"></div>
          </div>

          <div id="modal-barrages-section" hidden>
            <h3 class="modal-section-title">Barrages</h3>
            <div id="modal-barrages"></div>
          </div>

          <div id="modal-interaction-section" hidden>
            <h3 class="modal-section-title modal-section-title-row">
              Interaction
              <button type="button" id="modal-interaction-max-toggle" class="max-level-toggle" aria-pressed="false" hidden>
                <span class="max-level-dot"></span>Max Level
              </button>
            </h3>
            <div id="modal-interaction" class="modal-interaction-list"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <img id="gif-preview" class="gif-preview" alt="" hidden>

  <script src="data/ships.js"></script>
  <script src="data/equipment.js"></script>
  <script src="data/default-equipment.js"></script>
  <script src="app.js"></script>
</body>
</html>
